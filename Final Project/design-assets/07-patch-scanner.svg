<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="560" viewBox="0 0 1200 560" role="img"><title>High level patch panel connection detection</title>
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="#667783"/></marker></defs>
<rect width="1200" height="560" fill="white"/>
<text x="30" y="45.0" font-family="Arial, sans-serif" font-size="24" font-weight="700" fill="#182a37" text-anchor="start">PHYSICAL ACTION TO GAME FEEDBACK</text>
<rect x="30" y="100" width="340" height="145" rx="10" fill="#f1f5f7" stroke="#b9c8cf" stroke-width="2"/>
<text x="50" y="143.0" font-family="Arial, sans-serif" font-size="25" font-weight="700" fill="#182a37" text-anchor="start">CONNECT</text>
<text x="50" y="188.0" font-family="Arial, sans-serif" font-size="22" font-weight="400" fill="#182a37" text-anchor="start">Four patch cables</text>
<text x="50" y="217.7" font-family="Arial, sans-serif" font-size="22" font-weight="400" fill="#182a37" text-anchor="start">Eight mounted sockets</text>
<rect x="430" y="100" width="340" height="145" rx="10" fill="#f1f5f7" stroke="#b9c8cf" stroke-width="2"/>
<text x="450" y="143.0" font-family="Arial, sans-serif" font-size="25" font-weight="700" fill="#182a37" text-anchor="start">DETECT</text>
<text x="450" y="188.0" font-family="Arial, sans-serif" font-size="22" font-weight="400" fill="#182a37" text-anchor="start">Interface reports</text>
<text x="450" y="217.7" font-family="Arial, sans-serif" font-size="22" font-weight="400" fill="#182a37" text-anchor="start">source to port mapping</text>
<rect x="830" y="100" width="340" height="145" rx="10" fill="#f1f5f7" stroke="#b9c8cf" stroke-width="2"/>
<text x="850" y="143.0" font-family="Arial, sans-serif" font-size="25" font-weight="700" fill="#182a37" text-anchor="start">CHECK</text>
<text x="850" y="188.0" font-family="Arial, sans-serif" font-size="22" font-weight="400" fill="#182a37" text-anchor="start">Pi evaluates the</text>
<text x="850" y="217.7" font-family="Arial, sans-serif" font-size="22" font-weight="400" fill="#182a37" text-anchor="start">complete arrangement</text>
<line x1="374" y1="172" x2="422" y2="172" stroke="#667783" stroke-width="3" marker-end="url(#arrow)"/>
<line x1="774" y1="172" x2="822" y2="172" stroke="#667783" stroke-width="3" marker-end="url(#arrow)"/>
<line x1="1000" y1="245" x2="1000" y2="320" stroke="#667783" stroke-width="3"/>
<line x1="1000" y1="320" x2="600" y2="320" stroke="#667783" stroke-width="3"/>
<line x1="600" y1="320" x2="600" y2="365" stroke="#667783" stroke-width="3" marker-end="url(#arrow)"/>
<rect x="380" y="365" width="440" height="100" rx="10" fill="#edf5f2" stroke="#b9c8cf" stroke-width="2"/>
<text x="600" y="404.0" font-family="Arial, sans-serif" font-size="24" font-weight="700" fill="#182a37" text-anchor="middle">DISPLAY RESULT</text>
<text x="600" y="441.0" font-family="Arial, sans-serif" font-size="20" font-weight="400" fill="#182a37" text-anchor="middle">Revise connections or reveal final message</text>
<text x="30" y="525.0" font-family="Arial, sans-serif" font-size="23" font-weight="400" fill="#182a37" text-anchor="start">Interface and sensing circuit will be selected and verified during the build.</text>
</svg>